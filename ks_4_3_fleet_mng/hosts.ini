[ubuntu_servers]
node1 ansible_host=127.0.0.1 ansible_port=2201
node2 ansible_host=127.0.0.1 ansible_port=2202

[rpi_and_debian]
node3 ansible_host=127.0.0.1 ansible_port=2203
node4_rpi_sim ansible_host=127.0.0.1 ansible_port=2204
# Kui ühendad päris Raspberry Pi, eemalda lihtsalt '#' märk:
# rpi_physical ansible_host=192.168.1.100 ansible_port=22 ansible_user=opilane

[iot_alpine]
node5 ansible_host=127.0.0.1 ansible_port=2205

# Koondgrupp, mis hõlmab kõiki masinaid
[fleet:children]
ubuntu_servers
rpi_and_debian
iot_alpine

# Ühised muutujad meie Dockeri testkeskkonna jaoks
[fleet:vars]
ansible_user=root
ansible_ssh_pass=salasona
ansible_python_interpreter=/usr/bin/python3
